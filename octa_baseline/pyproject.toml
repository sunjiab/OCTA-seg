[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octa-baseline"
version = "0.1.0"
description = "OCTA-500 single-modality vessel-segmentation baseline"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "pillow",
  "tensorboard",
  "torch>=2.1",
  "tqdm",
]

[tool.setuptools.packages.find]
include = ["octa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

